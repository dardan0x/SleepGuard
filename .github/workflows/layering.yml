name: layering

on: [push, pull_request]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: UI-dependency layering check
        run: python3 scripts/check-layering.py
      - name: View size check (200-line limit)
        run: python3 scripts/check-view-size.py
