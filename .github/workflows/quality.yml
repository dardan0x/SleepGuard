name: quality

on: [push, pull_request, workflow_dispatch]

jobs:
  swiftformat:
    runs-on: ubuntu-latest
    # Prebuilt SwiftFormat 0.55.x Linux binaries segfault on GitHub runners
    # (swiftlang/swift#77841, nicklockwood/SwiftFormat#1930), so we build from
    # source in a Swift container instead of downloading the release binary.
    container: swift:6.0.3
    env:
      # Keep in sync with the version developers run locally (swiftformat --version).
      SWIFTFORMAT_VERSION: 0.55.5
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftFormat build
        uses: actions/cache@v4
        with:
          path: /tmp/swiftformat-build
          key: swiftformat-build-${{ env.SWIFTFORMAT_VERSION }}
      - name: Build SwiftFormat from source
        run: |
          if [ ! -x /tmp/swiftformat-build/release/swiftformat ]; then
            # The swift container has no curl, but ships git (SwiftPM needs it).
            git clone --depth 1 --branch "${SWIFTFORMAT_VERSION}" https://github.com/nicklockwood/SwiftFormat.git "/tmp/SwiftFormat-${SWIFTFORMAT_VERSION}"
            swift build --package-path "/tmp/SwiftFormat-${SWIFTFORMAT_VERSION}" --build-path /tmp/swiftformat-build --product swiftformat --configuration release -Xlinker -s
          fi
          install -m 755 /tmp/swiftformat-build/release/swiftformat /usr/local/bin/swiftformat
          swiftformat --version
      - name: Lint
        run: swiftformat --lint .

  hardcoded-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            git fetch origin main
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          fi
      - name: Check hardcoded strings
        run: python3 scripts/check-hardcoded-strings.py --base "${{ steps.base.outputs.ref }}"
